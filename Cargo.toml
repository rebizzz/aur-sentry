[package]
name = "aur-sentry"
version = "0.1.0"
edition = "2024"
authors = ["rebizzz"]
description = "Automated supply-chain malware watchdog & threat radar for the Arch User Repository"
license = "MIT"
repository = "https://github.com/rebizzz/aur-sentry"

[[bin]]
name = "aur-sentry"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
base64 = "0.23"

[profile.release]
lto = true
strip = true
opt-level = "z"
panic = "abort"
