name: Dynamic Package Audit

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scans/**'
      - 'data/**'
      - 'advisories.json'
      - 'advisories.xml'
      - 'ADVISORIES.md'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'scans/**'
      - 'data/**'
      - 'advisories.json'
      - 'advisories.xml'
      - 'ADVISORIES.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-arch-audit:
    name: Dynamic Arch Linux & namcap Verification
    if: "!startsWith(github.head_ref, 'scan/')"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Dynamic Egress & Security Audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Dynamic Arch Linux & namcap Verification Suite
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace archlinux:base bash -c "
            set -euo pipefail
            echo '=== Initializing Arch Linux Container ==='
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed git base-devel namcap rust cargo sudo shellcheck jq python
            echo '=== Running Dynamic Audit ==='
            bash scripts/arch_dynamic_audit.sh
          "
