name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scans/**'
      - 'data/**'
      - 'advisories.json'
      - 'advisories.xml'
      - 'ADVISORIES.md'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'scans/**'
      - 'data/**'
      - 'advisories.json'
      - 'advisories.xml'
      - 'ADVISORIES.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    if: "!startsWith(github.head_ref, 'scan/')"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Dynamic Egress & Security Audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  coverage:
    name: Code Coverage (Codecov)
    if: "!startsWith(github.head_ref, 'scan/')"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Dynamic Egress & Security Audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  shellcheck:
    name: ShellCheck
    if: "!startsWith(github.head_ref, 'scan/')"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Dynamic Egress & Security Audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck on shell scripts
        run: shellcheck bin/safeaur scripts/*.sh sandbox/*.sh
