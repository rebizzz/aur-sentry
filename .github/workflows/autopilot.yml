name: Autopilot Threat Radar

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test

      - name: Run Autopilot AUR scanner
        run: ./target/release/aur-sentry autopilot --repo-root . --window-hours 4 --limit 500

      - name: Commit updated threat radar
        run: |
          git config --global user.name "aur-sentry-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add advisories.json advisories.xml README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(autopilot): update AUR threat radar [skip ci]"
            git push
          else
            echo "No new advisories detected."
          fi
