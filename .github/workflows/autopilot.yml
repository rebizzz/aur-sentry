name: Autopilot Threat Radar

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '20 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ShellCheck static analyzer
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq

      - name: Cache cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build aur-sentry
        run: cargo build --release

      - name: Run unit test suite
        run: cargo test

      - name: Run Autopilot AUR scanner across metadata dump
        run: ./target/release/aur-sentry autopilot --repo-root . --window-hours 4 --limit 500

      - name: File automated GitHub Issue alerts for critical threats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f advisories.json ] && grep -q '"highest_severity": "CRITICAL"' advisories.json; then
            CRIT_PKGS=$(jq -r '.advisories[] | select(.highest_severity == "CRITICAL") | .package' advisories.json | head -5)
            for p in $CRIT_PKGS; do
              if ! gh issue list --state open --search "$p" --json title | grep -q "$p"; then
                echo "Creating automated security issue for $p..."
                gh issue create --title "[CRITICAL THREAT] Active supply-chain alert for $p" \
                  --body "AUR-Sentry Autopilot detected a CRITICAL severity supply-chain threat in package **$p**. Inspect \`advisories.json\` or the README Threat Radar for details." || true
              fi
            done
          fi

      - name: Create Separate Pull Requests for Radar & Feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "aur-sentry-bot"
          git config --global user.email "bot@users.noreply.github.com"

          mkdir -p /tmp/radar_stash
          cp README.md /tmp/radar_stash/ 2>/dev/null || true
          cp advisories.json /tmp/radar_stash/ 2>/dev/null || true
          cp advisories.xml /tmp/radar_stash/ 2>/dev/null || true

          git reset --hard HEAD

          # 1. Process README Threat Radar PR
          if [ -f /tmp/radar_stash/README.md ]; then
            cp /tmp/radar_stash/README.md README.md
            if ! git diff --quiet README.md; then
              echo "README threat radar has updates. Creating/updating PR..."
              git checkout -B autopilot/radar-readme origin/main
              git add README.md
              git commit -m "chore(radar): update live threat radar in README"
              git push -f origin autopilot/radar-readme
              EXISTING_PR=$(gh pr list --head autopilot/radar-readme --json number --jq '.[0].number')
              if [ -z "$EXISTING_PR" ]; then
                PR_BODY="Automated update to the live Threat Radar table in README.md based on the latest AUR metadata scan. Verified by automated CI & Codecov checks."
                gh pr create \
                  --title "chore(radar): update live threat radar in README" \
                  --body "$PR_BODY" \
                  --base main \
                  --head autopilot/radar-readme
              else
                echo "PR #$EXISTING_PR already exists for autopilot/radar-readme. Branch updated."
              fi
              git checkout main
              git reset --hard HEAD
            fi
          fi

          # 2. Process Machine Feeds PR
          if [ -f /tmp/radar_stash/advisories.json ]; then
            cp /tmp/radar_stash/advisories.json advisories.json 2>/dev/null || true
            cp /tmp/radar_stash/advisories.xml advisories.xml 2>/dev/null || true
            if ! git diff --quiet advisories.json advisories.xml; then
              echo "Machine feeds have updates. Creating/updating PR..."
              git checkout -B autopilot/radar-feeds origin/main
              git add advisories.json advisories.xml
              git commit -m "data(advisories): sync threat database feeds"
              git push -f origin autopilot/radar-feeds
              EXISTING_DATA_PR=$(gh pr list --head autopilot/radar-feeds --json number --jq '.[0].number')
              if [ -z "$EXISTING_DATA_PR" ]; then
                FEED_BODY="Automated synchronization of raw security advisory feeds (advisories.json and advisories.xml). Merge or drop this PR independently from the README radar."
                gh pr create \
                  --title "data(advisories): sync threat database feeds" \
                  --body "$FEED_BODY" \
                  --base main \
                  --head autopilot/radar-feeds
              else
                echo "PR #$EXISTING_DATA_PR already exists for autopilot/radar-feeds. Branch updated."
              fi
              git checkout main
              git reset --hard HEAD
            fi
          fi

          rm -rf /tmp/radar_stash
