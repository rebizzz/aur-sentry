name: Autopilot Threat Radar

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '20 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # open_scan_pr.sh dispatches scan.yml via gh workflow run

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Dynamic Egress & Runtime Security Audit)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ShellCheck static analyzer
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq

      - name: Cache cargo registry and build target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build aur-sentry
        run: cargo build --release

      - name: Run unit test suite
        run: cargo test

      - name: Run Autopilot AUR scanner across metadata dump
        run: ./target/release/aur-sentry autopilot --repo-root . --window-hours 4 --limit 500

      - name: Generate GitHub App token for aur-sentry bot
        id: app-token
        env:
          APP_ID: ${{ secrets.BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        if: env.APP_ID != '' && env.PRIVATE_KEY != ''
        uses: actions/create-github-app-token@c1a8d1f2e810749e701a979f648dce0832b85e17 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Triage scheduler — open scan PRs for new/changed/high-risk packages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'aur-sentry[bot]' }}
          BOT_EMAIL: ${{ steps.app-token.outputs.app-slug && format('{0}+{1}[bot]@users.noreply.github.com', secrets.BOT_APP_ID, steps.app-token.outputs.app-slug) || 'aur-sentry[bot]@users.noreply.github.com' }}
        run: |
          chmod +x scripts/triage_dispatch.sh
          # Cap kept deliberately small (20) so a single 2-hourly autopilot run
          # can never fan out into thousands of scan PRs / sandbox jobs and blow
          # through Actions concurrency/minutes, even though public-repo
          # minutes are themselves free (see ARCHITECTURE.md "Triage").
          bash scripts/triage_dispatch.sh . "${{ github.repository }}" 4 20 150

      - name: Create Pull Request for Threat Radar & Feeds
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          BOT_NAME: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'aur-sentry[bot]' }}
          BOT_EMAIL: ${{ steps.app-token.outputs.app-slug && format('{0}+{1}[bot]@users.noreply.github.com', secrets.BOT_APP_ID, steps.app-token.outputs.app-slug) || 'aur-sentry[bot]@users.noreply.github.com' }}
        run: |
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$BOT_EMAIL"

          if ! git diff --quiet ADVISORIES.md README.md advisories.json advisories.xml data/aur-state.json; then
            echo "Threat radar, machine feeds, or triage state have updates. Creating/updating PR..."
            git checkout -B autopilot/radar-advisories origin/main
            git add ADVISORIES.md README.md advisories.json advisories.xml data/aur-state.json
            git commit -m "chore(radar): update live threat radar, feeds, and triage state"
            git push -f origin autopilot/radar-advisories
            EXISTING_PR=$(gh pr list --head autopilot/radar-advisories --json number --jq '.[0].number')
            if [ -z "$EXISTING_PR" ]; then
              PR_BODY="Automated update to the live Threat Radar (ADVISORIES.md) and machine-readable feeds (advisories.json, advisories.xml) based on the latest AUR metadata scan. Verified by automated CI & Codecov checks."
              gh pr create \
                --title "chore(radar): update live threat radar and feeds" \
                --body "$PR_BODY" \
                --base main \
                --head autopilot/radar-advisories || echo "PR already open or creation skipped."
            else
              echo "PR #$EXISTING_PR already exists for autopilot/radar-advisories. Branch updated."
            fi
            git checkout main
          else
            echo "No changes in threat radar or feeds."
          fi
