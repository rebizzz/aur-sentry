name: Dynamic Threat Verification

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name to dynamically verify'
        required: true
        default: 'bitcoin-abc'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify Threat Package on Arch Linux
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[CRITICAL THREAT]'))
    steps:
      - name: Harden Runner (Security & Egress Audit)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build aur-sentry binary
        run: cargo build --release

      - name: Extract package name and issue number
        id: info
        # Issue titles are attacker-controlled (anyone can open an issue). Never splice
        # them directly into a `run:` script body via ${{ }} templating -- that's script
        # injection, since the template substitution happens before bash ever runs.
        # Pass through env: instead, which sets real environment variables.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_PKG: ${{ inputs.package_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "pkg=$INPUT_PKG" >> "$GITHUB_OUTPUT"
            echo "issue_num=" >> "$GITHUB_OUTPUT"
          else
            PKG=$(echo "$ISSUE_TITLE" | sed -E 's/.*for `?([a-zA-Z0-9_\.\-]+)`?/\1/')
            echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
            echo "issue_num=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Dynamic Threat Verification
        # Same injection class applies to step outputs derived from attacker input --
        # steps.info.outputs.pkg is regex-extracted from the (attacker-controlled) issue
        # title, so it also must not be spliced into the script body directly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ steps.info.outputs.pkg }}
          ISSUE_NUM: ${{ steps.info.outputs.issue_num }}
        run: |
          chmod +x scripts/verify_threat_issue.sh
          bash scripts/verify_threat_issue.sh "$PKG_NAME" "$ISSUE_NUM" "${{ github.repository }}"
