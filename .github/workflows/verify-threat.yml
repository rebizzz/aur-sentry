name: Dynamic Threat Verification

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name to dynamically verify'
        required: true
        default: 'bitcoin-abc'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify Threat Package on Arch Linux
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[CRITICAL THREAT]'))
    steps:
      - name: Harden Runner (Security & Egress Audit)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build aur-sentry binary
        run: cargo build --release

      - name: Extract package name and issue number
        id: info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pkg=${{ inputs.package_name }}" >> "$GITHUB_OUTPUT"
            echo "issue_num=" >> "$GITHUB_OUTPUT"
          else
            TITLE="${{ github.event.issue.title }}"
            PKG=$(echo "$TITLE" | sed -E 's/.*for `?([a-zA-Z0-9_\.\-]+)`?/\1/')
            echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
            echo "issue_num=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Dynamic Threat Verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/verify_threat_issue.sh
          bash scripts/verify_threat_issue.sh "${{ steps.info.outputs.pkg }}" "${{ steps.info.outputs.issue_num }}" "${{ github.repository }}"
