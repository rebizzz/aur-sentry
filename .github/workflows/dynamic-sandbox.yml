name: Dynamic Sandbox

# Phase 1 "disposable sandbox" (see ARCHITECTURE.md) — the $0 substitute for the
# AWS Fargate sandbox in the original vision. One job run == one disposable Arch
# Linux analysis lab for exactly one AUR package, destroyed when the job ends.
# GitHub-hosted runners only. No AWS/GCP/Azure, no paid services.

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'AUR package name to run through the disposable dynamic sandbox'
        required: true
        type: string
  repository_dispatch:
    types: [sentry-scan]

permissions:
  contents: write
  id-token: write # required for keyless Sigstore/cosign signing via GitHub OIDC

concurrency:
  group: dynamic-sandbox-${{ github.event.inputs.package_name || github.event.client_payload.package }}
  cancel-in-progress: false

jobs:
  sandbox:
    name: Disposable Dynamic Sandbox (Arch Linux, GitHub-hosted)
    runs-on: ubuntu-latest
    # Phase 3 added a reproducibility comparison pass (two extra real
    # `makepkg` builds, see scripts/dynamic_sandbox.sh) on top of the
    # original --nobuild pass, so the budget was raised from 30 -> 45min.
    # The install-phase pass (`pacman -U`/`-R` under strace, reusing an
    # already-built package — no extra build) is comparatively cheap, but
    # gets its own margin: 45 -> 55min.
    timeout-minutes: 55
    steps:
      - name: Harden Runner (Security & Egress Audit)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target package name
        id: pkg
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          if [ -z "$PKG" ]; then
            PKG="${{ github.event.client_payload.package }}"
          fi
          if [ -z "$PKG" ]; then
            echo "::error::no package name supplied (workflow_dispatch input 'package_name' or repository_dispatch client_payload.package)"
            exit 1
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Run disposable Arch Linux sandbox
        run: |
          chmod +x scripts/dynamic_sandbox.sh scripts/build_attestation.py
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash scripts/dynamic_sandbox.sh "${{ steps.pkg.outputs.name }}"

      - name: Reclaim ownership of sandbox output from the container's root user
        # The sandbox container runs as root (pacman/useradd/pacman -U all need it), so
        # everything it writes to the bind-mounted /workspace — including
        # data/attestations/ and .git/config via the checkout — ends up root-owned on
        # the host. The runner's own user then can't sign or commit it. Reclaim it here.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload raw sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-sandbox-evidence-${{ steps.pkg.outputs.name }}
          path: sandbox-evidence/${{ steps.pkg.outputs.name }}/
          if-no-files-found: ignore
          retention-days: 90

      - name: Install cosign
        if: always()
        uses: sigstore/cosign-installer@v3

      - name: Sign attestation(s) with cosign (keyless via GitHub OIDC)
        if: always()
        run: |
          set -uo pipefail
          ATTEST_DIR="data/attestations/${{ steps.pkg.outputs.name }}"
          if [ ! -d "$ATTEST_DIR" ]; then
            echo "no attestation directory for ${{ steps.pkg.outputs.name }}, nothing to sign"
            exit 0
          fi
          shopt -s nullglob
          for f in "$ATTEST_DIR"/*.json; do
            if [ -e "$f.sig" ] && [ -e "$f.cert" ]; then
              echo "already signed, skipping: $f"
              continue
            fi
            echo "signing $f"
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.cert" \
              "$f"
          done

      - name: Commit attestation
        if: always()
        run: |
          git config user.name "aur-sentry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/attestations
          if git diff --cached --quiet; then
            echo "No attestation changes to commit."
          else
            git commit -m "chore(sandbox): dynamic sandbox attestation for ${{ steps.pkg.outputs.name }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: File/update GitHub issue for SUSPICIOUS or MALICIOUS verdicts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ATTEST_DIR="data/attestations/${{ steps.pkg.outputs.name }}"
          chmod +x scripts/file_dynamic_threat_issue.sh
          shopt -s nullglob
          LATEST=""
          for f in "$ATTEST_DIR"/*.json; do
            LATEST="$f"
          done
          if [ -z "$LATEST" ]; then
            echo "no attestation found for ${{ steps.pkg.outputs.name }}, skipping notification"
            exit 0
          fi
          scripts/file_dynamic_threat_issue.sh "$LATEST" "${{ github.repository }}"
