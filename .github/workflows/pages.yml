name: Deploy Registry to GitHub Pages

# Builds docs/data/manifest.json from data/attestations/ and publishes docs/
# as a static site via GitHub Pages. No npm/node build step -- manifest
# generation is a stdlib-only Python script. Free for public repos.
#
# One-time manual setup required (cannot be done from a workflow file):
# repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/attestations/**'
      - 'scripts/build_registry_manifest.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manifest and prepare Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Security & Egress Audit)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Build registry manifest
        run: python3 scripts/build_registry_manifest.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
