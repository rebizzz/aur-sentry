name: Deploy Registry to GitHub Pages

# Builds docs/data/manifest.json from data/attestations/ and publishes docs/
# as a static site via GitHub Pages. No npm/node build step -- manifest
# generation is a stdlib-only Python script. Free for public repos.
#
# One-time manual setup required (cannot be done from a workflow file):
# repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/attestations/**'
      - 'scripts/build_registry_manifest.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manifest and prepare Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (Security & Egress Audit)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Build registry manifest
        run: python3 scripts/build_registry_manifest.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
