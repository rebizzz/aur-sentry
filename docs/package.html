<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package details — AUR Sentry</title>
<meta name="description" content="Evidence-based verification detail for an AUR package.">
<link rel="icon" type="image/png" href="assets/avatar.png">
<link rel="stylesheet" href="style.css">
<script>
// FOUC Prevention: apply saved or system theme before first paint
(function() {
  try {
    const saved = localStorage.getItem("aur-sentry-theme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (_) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <div class="site-branding">
      <img src="assets/avatar.png" alt="AUR Sentry Logo" class="site-logo">
      <div>
        <a class="site-title" href="index.html">AUR Sentry</a>
        <span class="site-tagline">Evidence-based AUR package verification</span>
      </div>
    </div>
    <div class="site-header-actions">
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">
        <!-- populated by registry.js initThemeToggle -->
      </button>
    </div>
  </div>
</header>

<main>
  <a class="back-link" href="index.html" id="back-link" onclick="if(window.history.length > 1){ window.history.back(); return false; }">
    <!-- Populated by script with icon -->
    &larr; Back to registry
  </a>

  <div id="content">
    <p class="empty-state">Loading package details&hellip;</p>
  </div>
</main>

<footer class="site-footer">
  <p>
    Attestations are generated automatically from static analysis and a disposable
    GitHub Actions sandbox. See
    <a href="https://github.com/rebizzz/aur-sentry/blob/main/ARCHITECTURE.md">ARCHITECTURE.md</a>
    for how the pipeline works.
  </p>
</footer>

<script src="registry.js"></script>
<script>
function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function renderError(msg) {
  document.getElementById("content").innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">&#9888;</div>
      <div class="empty-state-title">Unable to display package</div>
      <div class="empty-state-desc">${escapeHtml(msg)}</div>
      <a href="index.html" class="btn-reset-search">Return to registry</a>
    </div>
  `;
}

function summaryLine(cls, iconSvg, text) {
  return `<li class="summary-${cls}">${iconSvg}<span>${escapeHtml(text)}</span></li>`;
}

function buildPlainSummary(att) {
  const lines = [];
  const verdict = att.verdict;

  if (verdict === "BUILD_FAILED") {
    lines.push(summaryLine("bad", ICONS.cross, "Build failed in disposable sandbox"));
  } else {
    lines.push(summaryLine("ok", ICONS.check, "Build succeeded cleanly in sandbox"));
  }

  const findings = att.static_findings || [];
  const highSeverity = findings.filter((f) => f.severity === "HIGH" || f.severity === "CRITICAL");
  if (findings.length === 0) {
    lines.push(summaryLine("ok", ICONS.check, "No suspicious code patterns detected in PKGBUILD static analysis"));
  } else if (highSeverity.length > 0) {
    lines.push(summaryLine("bad", ICONS.cross, `${highSeverity.length} high/critical severity security finding(s) detected in PKGBUILD`));
  } else {
    lines.push(summaryLine("warn", ICONS.alertTriangle, `${findings.length} lower-severity finding(s) detected in PKGBUILD`));
  }

  const dyn = att.dynamic_evidence || { collected: false, network: [], filesystem: [] };
  if (!dyn.collected) {
    lines.push(summaryLine("neutral", ICONS.infoCircle, "No dynamic sandbox telemetry collected for this attestation yet"));
  } else {
    const undeclared = (dyn.network || []).filter((n) => n.protocol === "undeclared");
    if (undeclared.length > 0) {
      lines.push(summaryLine("bad", ICONS.cross, `${undeclared.length} undeclared network connection(s) detected during build`));
    } else {
      lines.push(summaryLine("ok", ICONS.check, "No suspicious or undeclared network connections observed"));
    }

    const canaryHits = (dyn.filesystem || []).filter((f) => f.operation === "canary_access");
    if (canaryHits.length > 0) {
      lines.push(summaryLine("bad", ICONS.cross, `Attempted access to ${canaryHits.length} planted canary credential file(s)`));
    } else {
      lines.push(summaryLine("ok", ICONS.check, "Canary credential integrity preserved (no exfiltration attempts)"));
    }
  }

  const repro = att.reproducibility;
  if (repro === "REPRODUCED") {
    lines.push(summaryLine("ok", ICONS.check, "Build was independently reproduced with identical bit-for-bit output"));
  } else if (repro === "DIVERGED") {
    lines.push(summaryLine("bad", ICONS.cross, "Independent verification build diverged from first build"));
  } else if (repro === "FAILED") {
    lines.push(summaryLine("warn", ICONS.alertTriangle, "Reproducibility comparison build failed"));
  } else {
    lines.push(summaryLine("neutral", ICONS.infoCircle, "Reproducibility verification not yet attempted"));
  }

  return lines.join("");
}

function findingsHtml(findings, pkgName, aurCommit) {
  if (!findings || findings.length === 0) {
    return `<p class="empty-state" style="padding:16px 0;">No static findings recorded.</p>`;
  }
  return findings.map((f) => {
    let locHtml = `${escapeHtml(f.file)}:${escapeHtml(String(f.line))}`;
    if (f.file === "PKGBUILD" && f.line > 0 && aurCommit && aurCommit !== "unknown") {
      const cgitLineUrl = `https://aur.archlinux.org/cgit/aur.git/tree/PKGBUILD?h=${encodeURIComponent(pkgName)}&id=${encodeURIComponent(aurCommit)}#n${f.line}`;
      locHtml = `<a href="${cgitLineUrl}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">${locHtml} ${ICONS.extLink}</a>`;
    }
    return `
      <div class="finding finding-${escapeHtml(f.severity)}">
        <div class="finding-top">
          <span>${escapeHtml(BEHAVIOR_COPY[f.behavior] || f.behavior)}</span>
          <span>${escapeHtml(f.severity)} &middot; ${locHtml}</span>
        </div>
        <div class="finding-desc">${escapeHtml(f.description)}</div>
      </div>
    `;
  }).join("");
}

function renderNetworkTable(events) {
  if (!events || events.length === 0) {
    return `<p class="package-meta">No external network connections observed during sandbox run.</p>`;
  }
  const rows = events.map((ev) => {
    const isUndeclared = ev.protocol === "undeclared";
    const protoBadge = isUndeclared
      ? `<span class="badge badge-MALICIOUS">undeclared</span>`
      : `<span class="badge badge-VERIFIED">${escapeHtml(ev.protocol || "standard")}</span>`;

    return `
      <tr>
        <td><code>${escapeHtml(ev.phase || "build")}</code></td>
        <td><code>${escapeHtml(ev.destination)}</code></td>
        <td><code>${escapeHtml(String(ev.port ?? "-"))}</code></td>
        <td>${protoBadge}</td>
        <td>${escapeHtml(formatTimestamp(ev.timestamp))}</td>
      </tr>
    `;
  }).join("");

  return `
    <div class="telemetry-table-container">
      <table class="telemetry-table">
        <thead>
          <tr>
            <th>Phase</th>
            <th>Destination</th>
            <th>Port</th>
            <th>Classification</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  `;
}

function renderOsvAdvisories(intel) {
  if (!intel || intel.length === 0) {
    return `<p class="package-meta">No external vulnerability advisories matched for this package version.</p>`;
  }

  return `
    <div class="osv-grid">
      ${intel.map((item) => `
        <div class="osv-card">
          <div class="osv-source-row">
            <span class="osv-source-badge">${escapeHtml(item.source || "osv.dev")}</span>
            ${item.url ? `
              <a class="ext-link-btn" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
                View Advisory ${ICONS.extLink}
              </a>
            ` : ""}
          </div>
          <div class="osv-summary">${escapeHtml(item.summary)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderDependencyTree(att) {
  const tree = att.dependency_tree || att.dependencies || (att.package_analysis && att.package_analysis.dependencies);
  if (!tree) return "";

  let treeContent = "";
  if (typeof tree === "string") {
    treeContent = escapeHtml(tree);
  } else if (Array.isArray(tree)) {
    treeContent = tree.map((d) => `├── ${escapeHtml(typeof d === 'string' ? d : (d.name || JSON.stringify(d)))}`).join("\n");
  } else if (typeof tree === "object") {
    const lines = [];
    if (tree.official && tree.official.length) {
      lines.push("Official Arch Linux Dependencies:");
      tree.official.forEach((d) => lines.push(`├── [core/extra] ${escapeHtml(typeof d === 'string' ? d : d.name)}`));
    }
    if (tree.aur && tree.aur.length) {
      lines.push("AUR Transitive Dependencies:");
      tree.aur.forEach((d) => lines.push(`├── [aur] ${escapeHtml(typeof d === 'string' ? d : d.name)}`));
    }
    if (tree.suspicious && tree.suspicious.length) {
      lines.push("Threat Warnings / Suspicious Dependencies:");
      tree.suspicious.forEach((w) => lines.push(`└── [WARNING] ${escapeHtml(typeof w === 'string' ? w : (w.message || w.name))}`));
    }
    treeContent = lines.join("\n");
  }

  if (!treeContent) return "";

  return `
    <h2>Dependency Analysis & BOM</h2>
    <div class="dep-tree-container">
      <div class="dep-tree-header">
        <span class="dep-tree-title">Resolved Dependency Tree</span>
        <span class="badge badge-VERIFIED">Multi-Source Audited</span>
      </div>
      <div class="dep-tree-content">${treeContent}</div>
    </div>
  `;
}

function renderCopyableHash(hash) {
  if (!hash) return "<code>not recorded</code>";
  return `
    <div class="copy-wrapper">
      <code>${escapeHtml(hash)}</code>
      <button type="button" class="copy-btn" onclick="copyToClipboard('${escapeHtml(hash)}', this)" aria-label="Copy hash" title="Copy to clipboard">
        ${ICONS.copy} Copy
      </button>
    </div>
  `;
}

function buildSignedNoticeHtml(path, hasSignature) {
  const sigUrl = RAW_BASE + path + ".sig";
  const certUrl = RAW_BASE + path + ".cert";
  const verifyCmd = `scripts/verify_attestation.sh ${path}`;

  if (hasSignature) {
    return `
      <div class="signed-notice">
        &#128274; <strong>Cryptographically Signed</strong> (Keyless Sigstore / GitHub Actions OIDC)
        &mdash;
        <a href="${sigUrl}" target="_blank" rel="noopener">.sig</a> &middot;
        <a href="${certUrl}" target="_blank" rel="noopener">.cert</a>
        <div style="margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span style="font-size:0.82rem; color:var(--text-muted);">Verify locally:</span>
          <code>${escapeHtml(verifyCmd)}</code>
          <button type="button" class="copy-btn" onclick="copyToClipboard('${escapeHtml(verifyCmd)}', this)" title="Copy verification command">
            ${ICONS.copy} Copy Command
          </button>
        </div>
      </div>
    `;
  }
  return `
    <div class="signed-notice">
      &#9888; <strong>Signature:</strong> Not yet cryptographically signed with Sigstore.
    </div>
  `;
}

function buildHistorySectionFromManifest(pkgName, currentVersion, versions) {
  if (!versions || versions.length === 0) {
    return `<p class="empty-state" style="padding:16px 0;">No prior versions recorded in registry.</p>`;
  }

  // Sort chronologically (oldest -> newest) to compare PKGBUILD sha256 transitions
  const chrono = [...versions].sort((a, b) => (a.analyzed_at < b.analyzed_at ? -1 : 1));
  const diffNotes = new Map();

  for (let i = 1; i < chrono.length; i++) {
    const cur = chrono[i];
    const prev = chrono[i - 1];
    if (cur.pkgbuild_sha256 && prev.pkgbuild_sha256) {
      diffNotes.set(cur.version, cur.pkgbuild_sha256 === prev.pkgbuild_sha256
        ? "PKGBUILD unchanged since previous scan"
        : "PKGBUILD updated since previous scan");
    }
  }

  // Render newest first for display
  const rows = [...chrono].reverse().map((entry) => {
    const isCurrent = entry.version === currentVersion;
    const note = diffNotes.get(entry.version);
    const rawUrl = RAW_BASE + entry.path;

    return `
      <li class="${isCurrent ? "history-item-current" : ""}">
        <div class="history-row-top">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="mono" style="font-weight:700;">${escapeHtml(entry.version)}</span>
            ${isCurrent ? `<span class="history-current-tag">Current view</span>` : ""}
            ${badgeHtml(entry.verdict)}
          </div>
          <div class="history-actions">
            ${!isCurrent ? `
              <a class="ext-link-btn" href="${packagePageUrl(pkgName, entry.version)}">
                Inspect in UI
              </a>
            ` : ""}
            <a class="ext-link-btn" href="${rawUrl}" target="_blank" rel="noopener">
              Raw JSON ${ICONS.extLink}
            </a>
          </div>
        </div>
        <div class="package-meta">
          <span>analyzed ${escapeHtml(formatTimestamp(entry.analyzed_at))}</span>
          ${note ? `<span>&middot;</span><span>${escapeHtml(note)}</span>` : ""}
          ${entry.findings_count ? `<span>&middot;</span><span>${entry.findings_count} finding${entry.findings_count === 1 ? "" : "s"}</span>` : ""}
        </div>
      </li>
    `;
  }).join("");

  return `<ul class="summary-list">${rows}</ul>`;
}

async function render() {
  initThemeToggle();

  // Set Back Link with Left Arrow
  const backLink = document.getElementById("back-link");
  if (backLink) {
    backLink.innerHTML = `${ICONS.arrowLeft} Back to registry`;
  }

  const name = qs("name");
  const requestedVersion = qs("version");

  if (!name) {
    renderError("No package specified in query string. Please return to the registry and choose a package.");
    return;
  }

  // Fetch manifest to resolve version list
  let entries;
  try {
    entries = await fetchManifest();
  } catch (err) {
    renderError(`Could not load package manifest (${err.message}).`);
    return;
  }

  // Find all entries for this package
  const pkgVersions = entries
    .filter((e) => e.package === name)
    .sort((a, b) => (a.analyzed_at < b.analyzed_at ? 1 : -1));

  if (pkgVersions.length === 0) {
    renderError(`Package "${name}" was not found in the AUR Sentry registry manifest.`);
    return;
  }

  // Pick target version: either specifically requested ?version=... or latest
  let selectedEntry = pkgVersions[0];
  if (requestedVersion) {
    const found = pkgVersions.find((v) => v.version === requestedVersion);
    if (found) {
      selectedEntry = found;
    }
  }

  // Load attestation data using relative-first offline-resilient fetcher
  let att;
  try {
    att = await fetchAttestationData(selectedEntry.path);
  } catch (err) {
    renderError(`Could not load attestation data for "${name}" version ${selectedEntry.version} (${err.message}).`);
    return;
  }

  // Update Page Title
  document.title = `${att.package.name} ${att.package.version} — AUR Sentry Verification`;

  // External context links
  const aurPkgUrl = `https://aur.archlinux.org/packages/${encodeURIComponent(name)}`;
  const aurCommit = att.source && att.source.aur_commit;
  const cgitCommitUrl = (aurCommit && aurCommit !== "unknown")
    ? `https://aur.archlinux.org/cgit/aur.git/commit/?h=${encodeURIComponent(name)}&id=${encodeURIComponent(aurCommit)}`
    : null;

  // Hero Verdict Info
  const heroData = getHeroVerdictData(att.verdict);
  const heroClass = `hero-verdict-${att.verdict === 'VERIFIED' || att.verdict === 'SUSPICIOUS' || att.verdict === 'MALICIOUS' || att.verdict === 'BUILD_FAILED' ? att.verdict : 'OTHER'}`;

  // Signature check
  const hasSig = Boolean(selectedEntry.has_signature || att.signature);
  const signedHtml = buildSignedNoticeHtml(selectedEntry.path, hasSig);

  const isExample = name.startsWith("example-");
  const noticeHtml = isExample ? `
    <div class="notice">
      This is example test data used to preview this interface &mdash; not a real scan result.
    </div>
  ` : "";

  // Render Full Content
  document.getElementById("content").innerHTML = `
    ${noticeHtml}

    <div class="package-header-row">
      <div class="package-header-title">
        <h1>${escapeHtml(att.package.name)}</h1>
        <span class="mono" style="font-size:1.05rem; font-weight:600;">v${escapeHtml(att.package.version)}</span>
        <span class="package-meta" style="margin-top:0;">(${escapeHtml(att.package.arch || "x86_64")})</span>
      </div>
      <div class="package-header-links">
        <a class="ext-link-btn" href="${aurPkgUrl}" target="_blank" rel="noopener" title="View package on AUR">
          AUR Package ${ICONS.extLink}
        </a>
        ${cgitCommitUrl ? `
          <a class="ext-link-btn" href="${cgitCommitUrl}" target="_blank" rel="noopener" title="Inspect commit in AUR cgit">
            AUR Commit ${ICONS.extLink}
          </a>
        ` : ""}
      </div>
    </div>

    <!-- Prominent Hero Verdict Banner -->
    <div class="hero-verdict-banner ${heroClass}">
      <div class="hero-verdict-icon-container">
        ${heroData.icon}
      </div>
      <div class="hero-verdict-body">
        <div class="hero-verdict-tag">${escapeHtml(heroData.tag)}</div>
        <h2 class="hero-verdict-title">${escapeHtml(heroData.title)}</h2>
        <p class="hero-verdict-desc">${escapeHtml(heroData.desc)}</p>
      </div>
    </div>

    ${signedHtml}

    <h2>What this means</h2>
    <ul class="summary-list">
      ${buildPlainSummary(att)}
    </ul>

    ${renderDependencyTree(att)}

    <!-- Expandable Raw Evidence Section -->
    <details class="why" open>
      <summary>Verification Evidence & Auditing Details</summary>
      <div class="why-body">

        <h3>Source Identity & Checksums</h3>
        <table class="identity">
          <tr>
            <th>AUR commit</th>
            <td>
              ${cgitCommitUrl ? `
                <div class="copy-wrapper">
                  <code><a href="${cgitCommitUrl}" target="_blank" rel="noopener" style="color:inherit;">${escapeHtml(aurCommit)}</a></code>
                  <button type="button" class="copy-btn" onclick="copyToClipboard('${escapeHtml(aurCommit)}', this)" title="Copy commit sha">
                    ${ICONS.copy} Copy
                  </button>
                </div>
              ` : `<code>${escapeHtml(aurCommit || "unknown")}</code>`}
            </td>
          </tr>
          <tr>
            <th>PKGBUILD sha256</th>
            <td>${renderCopyableHash(att.source.pkgbuild_sha256)}</td>
          </tr>
          <tr>
            <th>Install sha256</th>
            <td>${renderCopyableHash(att.source.install_sha256)}</td>
          </tr>
          <tr>
            <th>Evidence hash</th>
            <td>${renderCopyableHash(att.evidence_hash)}</td>
          </tr>
          <tr>
            <th>Scanner version</th>
            <td><code>${escapeHtml(att.scanner_version)}</code></td>
          </tr>
          <tr>
            <th>Reproducibility</th>
            <td><code>${escapeHtml(att.reproducibility)}</code></td>
          </tr>
        </table>

        <h3>Static Analysis Findings (${(att.static_findings || []).length})</h3>
        ${findingsHtml(att.static_findings, att.package.name, aurCommit)}

        <h3>Dynamic Sandbox Network Telemetry</h3>
        <p class="package-meta">
          ${att.dynamic_evidence && att.dynamic_evidence.collected
            ? "Network connections recorded inside the disposable sandbox container during build and packaging:"
            : "No dynamic sandbox telemetry was recorded for this attestation."}
        </p>
        ${renderNetworkTable(att.dynamic_evidence ? att.dynamic_evidence.network : [])}

        ${(att.external_intelligence || []).length > 0 ? `
          <h3>External Vulnerability Intelligence (OSV.dev)</h3>
          ${renderOsvAdvisories(att.external_intelligence)}
        ` : ""}

        <h3>Raw Attestation Artifact</h3>
        <p class="package-meta">Full signed JSON attestation data adhering to attestation v1.0 schema:</p>
        <pre class="evidence">${escapeHtml(JSON.stringify(att, null, 2))}</pre>
      </div>
    </details>

    <!-- Version History Section (Manifest-driven, 0 GitHub API rate limits) -->
    <details class="why" id="history-details" ${pkgVersions.length > 1 ? "open" : ""}>
      <summary>Version History &mdash; ${pkgVersions.length} scan${pkgVersions.length === 1 ? "" : "s"} recorded in manifest</summary>
      <div class="why-body" id="history-body">
        ${buildHistorySectionFromManifest(name, att.package.version, pkgVersions)}
      </div>
    </details>
  `;
}

render();
</script>
</body>
</html>
